---
name: Release

# Pushing a tag like v1.0.1 builds every platform on GitHub's runners and
# publishes a release, so nothing has to be built on a local machine.
#
# A manual run from the Actions tab only builds and uploads the artifacts, so
# the pipeline can be exercised without publishing anything.
"on":
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in step with the README's requirement and the local toolchain.
  FLUTTER_VERSION: 3.47.5
  # Pinned pi backend bundled into pi_runtime/ by tool/stage_pi_runtime.*.
  # Bump deliberately: the app ships whatever version this names.
  PI_VERSION: 0.87.0
  NODE_VERSION: 22
  # npm scope of the pi backend package; factored out so install lines stay
  # within the line-length limit.
  PI_NPM_SCOPE: '@earendil-works/pi-coding-agent'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      # Pinned: checkout v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Pinned: setup-node v7.0.0.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Pinned: flutter-action v2.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Serialised on purpose: compiling several test files in parallel
      # intermittently kills a test isolate before it starts, which shows up
      # as "did not complete" with no exception.
      - name: Test
        run: flutter test --concurrency=1

      - name: Build
        run: flutter build windows --release

      - name: Stage bundled pi runtime
        shell: pwsh
        run: |
          # setup-node (top of this job) provides the node staged into
          # pi_runtime/bin; keep that step above the build.
          $node = (Get-Command node).Source
          & $node --version
          $pkg = '{0}@{1}' -f $env:PI_NPM_SCOPE, $env:PI_VERSION
          npm install -g --ignore-scripts $pkg
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          $piDir = Join-Path (& npm root -g) $env:PI_NPM_SCOPE
          $env:PI_STUDIO_NODE_EXE = $node
          $env:PI_STUDIO_PI_DIR = $piDir
          $out = 'build/windows/x64/runner/Release'
          ./tool/stage_pi_runtime.ps1 -OutputDir $out

      - name: Package Windows artifacts
        shell: pwsh
        env:
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:GH_REF_TYPE -eq 'tag') {
            $version = $env:GH_REF_NAME.TrimStart('v')
          } else {
            $match = Select-String -Path pubspec.yaml `
              -Pattern '^version:\s+([0-9]+\.[0-9]+\.[0-9]+)'
            $version = $match.Matches[0].Groups[1].Value
          }
          Write-Host "Packaging $version"

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          & $iscc "/DMyAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }

          # Zip whatever the build actually produced rather than a fixed file
          # list. native_assets.json is present in some builds and not others,
          # and naming a missing entry fails the whole step.
          $release = 'build\windows\x64\runner\Release'
          $items = Get-ChildItem $release -Force |
            Select-Object -ExpandProperty Name
          Write-Host "Zipping: $($items -join ', ')"

          # tar, not Compress-Archive: the latter writes backslash path
          # separators, which are not valid ZIP paths and break extraction on
          # anything but Windows Explorer.
          $zip = "dist\PiStudio-$version-Portable-x64.zip"
          tar.exe -a -c -f $zip -C $release @items
          if ($LASTEXITCODE -ne 0) { throw 'tar failed' }

          Get-ChildItem dist | ForEach-Object {
            Write-Host "  $($_.Name)  $($_.Length) bytes"
          }

      # Pinned: upload-artifact v7.0.1.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      # Pinned: checkout v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      # Pinned: flutter-action v2.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Analyze but do not test here: the widget tests are verified on
      # Windows, and a platform-specific failure should not block a release.
      - run: flutter analyze

      # Pinned: setup-node v7.0.0.
      - name: Install pinned node for the bundled pi runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: flutter build linux --release

      - name: Stage bundled pi runtime
        run: |
          # setup-node's node is the binary staged into pi_runtime/bin.
          echo "node: $(node --version) from $(command -v node)"
          pkg="$PI_NPM_SCOPE@$PI_VERSION"
          npm install -g --ignore-scripts "$pkg"
          export PI_STUDIO_NODE_EXE="$(command -v node)"
          pi_dir="$(npm root -g)/$PI_NPM_SCOPE"
          export PI_STUDIO_PI_DIR="$pi_dir"
          ./tool/stage_pi_runtime.sh build/linux/x64/release/bundle

      - name: Package Linux tarball
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version:' pubspec.yaml | sed -E \
              's/version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          fi
          echo "Packaging $version"
          mkdir -p dist
          tar -czf "dist/PiStudio-${version}-Linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .
          ls -la dist

      # Pinned: upload-artifact v7.0.1.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # Pinned: download-artifact v4.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          # Re-running a tag should update the release rather than fail on it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Pi Studio ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              dist/*
          fi
