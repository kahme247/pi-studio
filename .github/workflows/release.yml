name: Release

# Pushing a tag like v1.0.1 builds every platform on GitHub's runners and
# publishes a release, so nothing has to be built on a local machine.
#
# A manual run from the Actions tab only builds and uploads the artifacts, so
# the pipeline can be exercised without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in step with the README's requirement and the local toolchain.
  FLUTTER_VERSION: 3.47.5

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Serialised on purpose: compiling several test files in parallel
      # intermittently kills a test isolate before it starts, which shows up as
      # "did not complete" with no exception.
      - name: Test
        run: flutter test --concurrency=1

      - name: Build
        run: flutter build windows --release

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'.TrimStart('v')
          } else {
            (Select-String -Path pubspec.yaml -Pattern '^version:\s+([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          }
          Write-Host "Packaging $version"

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          & $iscc "/DMyAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }

          # Zip whatever the build actually produced rather than a fixed file
          # list. native_assets.json is present in some builds and not others,
          # and naming a missing entry fails the whole step.
          $release = 'build\windows\x64\runner\Release'
          $items = Get-ChildItem $release -Force |
            Select-Object -ExpandProperty Name
          Write-Host "Zipping: $($items -join ', ')"

          # tar, not Compress-Archive: the latter writes backslash path
          # separators, which are not valid ZIP paths and break extraction on
          # anything but Windows Explorer.
          tar.exe -a -c -f "dist\PiStudio-$version-Portable-x64.zip" -C $release @items
          if ($LASTEXITCODE -ne 0) { throw 'tar failed' }

          Get-ChildItem dist | ForEach-Object { Write-Host "  $($_.Name)  $($_.Length) bytes" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Analyze but do not test here: the widget tests are verified on Windows,
      # and a platform-specific failure should not block a release.
      - run: flutter analyze

      - run: flutter build linux --release

      - name: Package Linux tarball
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          fi
          echo "Packaging $version"
          mkdir -p dist
          tar -czf "dist/PiStudio-${version}-Linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          # Re-running a tag should update the release rather than fail on it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Pi Studio ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              dist/*
          fi
